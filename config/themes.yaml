# Vertical configuration — swappable with ZERO code changes.
# The marketing owner edits this file to change vertical, brands, themes, and date
# windows. The constrained theme vocabulary is what Gemma is allowed to emit and what
# scoring aggregates over. Keep it to 4-8 themes.

vertical: music & media streaming     # brand-neutral; mirrors the Spotify case study without naming real companies

# Fictional, brand-neutral competitor apps (no real companies).
brands:
  - Streamly
  - Wavecast
  - Tunefox

# Two periods of consumer commentary, used for the "recent momentum" scoring component.
periods:
  previous: { start: "2026-07-01", end: "2026-08-31" }
  recent:   { start: "2026-09-01", end: "2026-10-31" }

# Constrained theme vocabulary (4-8). `synonyms` drive the deterministic keyword
# fallback classifier AND counterevidence keyword matching when the model is offline.
themes:
  variety:
    label: "Variety (less repetitive)"
    synonyms: [repetitive, repeat, repeats, variety, varied, rotation, boring, stale, fresh, samey]
  control:
    label: "Control & customization"
    synonyms: [control, customize, customise, customization, manual, skip, choose, adjust, settings, tune]
  discovery:
    label: "Discovery & personalization"
    synonyms: [discover, discovery, recommend, recommendation, recommendations, personalized, personalised, explore, suggestion, suggestions]
  price:
    label: "Price & subscription"
    synonyms: [price, expensive, cheap, afford, affordable, cost, subscription, premium, worth]
  audio_quality:
    label: "Audio quality"
    synonyms: [quality, sound, bitrate, audio, lossless, crisp, hi-fi]
  ads:
    label: "Ads & interruptions"
    synonyms: [ad, ads, advert, adverts, interrupt, interruptions, commercial]

# Scoring guardrails (see trendlens/scoring.py). All weights sum to 1.0.
scoring:
  weights:
    consumer_freq: 0.30
    momentum: 0.25
    underrepresentation: 0.25
    evidence_quality: 0.20
  min_support_records: 3        # below this -> "insufficient_evidence"
  tiny_sample_penalty: 0.10     # applied when support is at/just above the minimum
  contradiction_penalty: 0.15   # applied per net contradicting campaign
